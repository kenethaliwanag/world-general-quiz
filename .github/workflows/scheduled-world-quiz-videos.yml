name: Scheduled World General Knowledge Quiz Generation

on:
  # Run 06:00 PM Philippine Time (UTC+8).
  # Run 12:00 AM Philippine Time (UTC+8).
  schedule:
    - cron: "0 10 * * *" # 06:00 PM PHT
    - cron: "0 16 * * *" # 12:00 AM PHT
  workflow_dispatch:
    inputs:
      questions_per_part:
        type: string
        default: "15"
      enable_tts:
        type: boolean
        default: true
      enable_render:
        type: boolean
        default: true
      confirm_live_publish:
        description: "Explicitly authorize live Facebook publishing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  KOKORO_BASE_URL: "http://127.0.0.1:8880"
  KOKORO_MODEL: "kokoro"
  KOKORO_VOICE: "af_bella"
  KOKORO_RESPONSE_FORMAT: "mp3"

jobs:
  generate:
    name: Scheduled Generate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: world-quiz-generation
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: world-quiz-hyperframes-browser-${{ runner.os }}
          restore-keys: world-quiz-hyperframes-browser-
      - run: npm install --global hyperframes@0.9.20
      - run: npx hyperframes browser ensure

      - name: Set up Kokoro TTS server
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_tts != false }}
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          if [ ! -d kokoro-server ]; then
            git clone --depth 1 --branch v0.9.2 https://github.com/remsky/Kokoro-FastAPI.git kokoro-server
          fi
          cd kokoro-server
          export PROJECT_ROOT="$PWD"
          export USE_GPU=false
          export PYTHONPATH="$PROJECT_ROOT:$PROJECT_ROOT/api"
          export MODEL_DIR=src/models
          export VOICES_DIR=src/voices/v1_0
          export WEB_PLAYER_PATH="$PROJECT_ROOT/web"
          export ESPEAK_DATA_PATH=/usr/lib/x86_64-linux-gnu/espeak-ng-data
          export HOST=127.0.0.1
          export PORT=8880
          export API_LOG_LEVEL=WARNING
          export PYTHONUTF8=1
          uv venv --python 3.12
          uv pip install --python "$PWD/.venv/bin/python" -e ".[cpu]"
          ./.venv/bin/python -m uvicorn --version
          uv run --python "$PWD/.venv/bin/python" --no-sync python docker/scripts/download_model.py --output api/src/models/v1_0
          nohup "./.venv/bin/python" -m uvicorn api.src.main:app --host "${HOST}" --port "${PORT}" --workers 1 > /tmp/kokoro.log 2>&1 &
          for attempt in $(seq 1 300); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then
              curl -fsS "http://127.0.0.1:${PORT}/v1/models" >/dev/null 2>&1
              echo "Kokoro TTS is ready."
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null
          curl -fsS "http://127.0.0.1:${PORT}/v1/models" >/dev/null

      - name: Upload Kokoro startup logs on failure
        if: failure() && (github.event_name != 'workflow_dispatch' || inputs.enable_tts != false)
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-startup-logs-${{ github.run_id }}
          path: /tmp/kokoro.log
          retention-days: 7
          if-no-files-found: warn


      - name: Generate next quiz Part
        env:
          QUESTIONS_PER_PART: ${{ inputs.questions_per_part || 15 }}
          ENABLE_TTS: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_tts != false }}
          ENABLE_RENDER: ${{ github.event_name != 'workflow_dispatch' || inputs.enable_render != false }}
        run: |
          set -euo pipefail
          TOTAL_PARTS=1
          CATEGORY="all"
          DIFFICULTY="all"
          START_PART="$(python -c 'from core.history_manager import next_part_number; print(next_part_number())')"
          TTS_ARG=""
          RENDER_ARG=""
          if [ "$ENABLE_TTS" = "true" ]; then
            TTS_ARG="--tts"
          fi
          if [ "$ENABLE_RENDER" = "true" ]; then
            RENDER_ARG="--render"
          fi
          for PART_NUMBER in $(seq "$START_PART" "$((START_PART + TOTAL_PARTS - 1))"); do
            python main.py \
              --part "$PART_NUMBER" \
              --count "$QUESTIONS_PER_PART" \
              --category "$CATEGORY" \
              --difficulty "$DIFFICULTY" \
              $TTS_ARG \
              $RENDER_ARG \
              --render-reels \
              --reels-question-count 5 \
              --render-ten-video \
              --ten-question-count 10
            if ! git diff --quiet -- data/used_questions.json; then
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add data/used_questions.json
              git commit -m "Update quiz question history for Part $(printf '%03d' "$PART_NUMBER") [skip ci]"
              git push origin HEAD:main
            fi
          done

      - name: Verify required Facebook Meta secrets
        if: github.event_name == 'schedule' || inputs.confirm_live_publish == true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${META_PAGE_ID}" ] || [ -z "${META_PAGE_ACCESS_TOKEN}" ]; then
            echo "Missing required Meta secret. META_PAGE_ID and META_PAGE_ACCESS_TOKEN must be configured." >&2
            exit 1
          fi

      - name: Publish generated 10-question Facebook Page Video
        if: github.event_name == 'schedule' || inputs.confirm_live_publish == true
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          FACEBOOK_PUBLISH_ENABLED: "true"
          FACEBOOK_PUBLISH_DRY_RUN: "false"
        run: |
          set -euo pipefail
          PART_NUMBER="$(python -c 'from core.history_manager import load_history; print(load_history().get("last_part", 1))')"
          if [ "$PART_NUMBER" -lt 1 ]; then
            echo "Invalid last Part number: ${PART_NUMBER}" >&2
            exit 1
          fi
          echo "Publishing 10-question Facebook Page Video for Part ${PART_NUMBER}"
          python main.py --publish --part "$PART_NUMBER" --publish-content-type ten_question_video

      - name: Persist Facebook publication history
        if: always()
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/facebook_publish_history.json; then
            PART_NUMBER="$(python -c 'from core.history_manager import load_history; print(load_history().get("last_part", 1))')"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/facebook_publish_history.json
            git commit -m "Record Facebook Page Video publication for Part $(printf '%03d' "$PART_NUMBER") [skip ci]"
            git push origin HEAD:main
          fi

      # YouTube runs in this same job, after Facebook generation/persistence, so both
      # platforms update the shared question history sequentially on one runner.
      - name: Verify required YouTube secrets
        if: github.event_name == 'schedule'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          set -euo pipefail
          python main.py --youtube-check-secrets

      - name: Resolve YouTube Part and output path
        id: youtube_part
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          PART="$(python -c 'from core.youtube_output import TEN_QUESTION_CONTENT_TYPE, next_youtube_part_number; print(next_youtube_part_number(content_type=TEN_QUESTION_CONTENT_TYPE))')"
          if [ "$PART" -lt 1 ]; then
            echo "Invalid YouTube Part number: ${PART}" >&2
            exit 1
          fi
          echo "part_number=$PART" >> "$GITHUB_OUTPUT"
          python - "$PART" >> "$GITHUB_OUTPUT" <<'PY'
          import sys
          from pathlib import Path
          from core.youtube_output import youtube_ten_question_video_path

          part = int(sys.argv[1])
          video = youtube_ten_question_video_path(part, Path("output/youtube"))
          print(f"video_path={video}")
          print(f"needs_generation={0 if video.is_file() else 1}")
          PY

      - name: Generate one YouTube 10-question video
        if: github.event_name == 'schedule'
        env:
          PART_NUMBER: ${{ steps.youtube_part.outputs.part_number }}
        run: |
          set -euo pipefail
          PART_NUMBER="$PART_NUMBER"
          if [ "${{ steps.youtube_part.outputs.needs_generation }}" = "1" ]; then
            python main.py \
              --part "$PART_NUMBER" \
              --count 10 \
              --category all \
              --difficulty all \
              --tts \
              --render-ten-video \
              --ten-question-count 10 \
              --youtube-ten-question-video \
              --output-root output/youtube
          else
            echo "YouTube 10-question video already exists for Part ${PART_NUMBER}; skipping generation to avoid overwriting it."
          fi

      - name: Validate generated YouTube 10-question video with ffprobe
        if: github.event_name == 'schedule'
        env:
          PART_NUMBER: ${{ steps.youtube_part.outputs.part_number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from core.youtube_output import youtube_ten_question_video_path

          part = int(os.environ["PART_NUMBER"])
          video = youtube_ten_question_video_path(part, Path("output/youtube"))
          if not video.is_file():
              raise SystemExit(f"Generated YouTube 10-question video not found: {video}")
          size = video.stat().st_size
          if size <= 0:
              raise SystemExit(f"Generated YouTube 10-question video is empty: {video}")
          script = video.parent / "script.json"
          if not script.is_file():
              raise SystemExit(f"Associated script JSON not found: {script}")
          quiz = json.loads(script.read_text(encoding="utf-8"))
          questions = quiz.get("questions", [])
          if len(questions) != 10:
              raise SystemExit(f"Expected exactly 10 questions in {script}, found {len(questions)}")
          data = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "stream=codec_type,codec_name,width,height,r_frame_rate",
              "-show_entries", "format=duration",
              "-of", "json", str(video),
          ], text=True))
          streams = data.get("streams", [])
          v = next((s for s in streams if s.get("codec_type") == "video"), None)
          a = next((s for s in streams if s.get("codec_type") == "audio"), None)
          duration = float(data.get("format", {}).get("duration", 0) or 0)
          print(f"Video: {video}")
          print(f"File size: {size} bytes")
          print(f"Questions in script: {len(questions)}")
          if not v:
              raise SystemExit("No video stream in generated video")
          if not a:
              raise SystemExit("No audio stream in generated video")
          print(f"Video: {v.get('width')}x{v.get('height')} {v.get('codec_name')} {v.get('r_frame_rate')}")
          print(f"Audio: {a.get('codec_name')}")
          print(f"Measured duration: {duration:.3f}s")
          if (v.get("width"), v.get("height")) != (1080, 1920):
              raise SystemExit("Invalid resolution; expected 1080x1920")
          if v.get("codec_name") != "h264":
              raise SystemExit("Invalid video codec; expected h264")
          if v.get("r_frame_rate") != "30/1":
              raise SystemExit("Invalid frame rate; expected 30/1")
          if a.get("codec_name") != "aac":
              raise SystemExit("Invalid audio codec; expected aac")
          if duration <= 0:
              raise SystemExit("Invalid duration; expected a positive value")
          print("Note: YouTube may classify vertical videos up to 3 minutes as Shorts; no padding is applied.")
          print("Scheduled YouTube 10-question video preflight: PASS")
          PY

      - name: Publish generated YouTube 10-question video (Public)
        id: youtube_publish
        if: github.event_name == 'schedule'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_ALLOW_NETWORK_UPLOAD: "true"
          YOUTUBE_ALLOW_PUBLIC_UPLOAD: "true"
          YOUTUBE_PUBLISH_ENABLED: "true"
          YOUTUBE_PUBLISH_DRY_RUN: "false"
          YOUTUBE_PRIVACY_STATUS: "public"
          PART_NUMBER: ${{ steps.youtube_part.outputs.part_number }}
        run: |
          set -euo pipefail
          python main.py --youtube-video-upload \
            --part "$PART_NUMBER" \
            --output-root output/youtube \
            --youtube-scheduled-upload

      - name: Persist YouTube publication history and question history
        if: always() && github.event_name == 'schedule'
        env:
          PART_NUMBER: ${{ steps.youtube_part.outputs.part_number }}
        run: |
          set -euo pipefail
          PART="${PART_NUMBER:-0}"
          CHANGED="$(git status --porcelain -- data/used_questions.json data/youtube_publish_history.json)"
          if [ -z "$CHANGED" ]; then
            echo "No YouTube or question history changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage and commit the runner's history changes BEFORE rebasing.
          # Rebasing with modified but unstaged files fails with:
          # "cannot rebase: You have unstaged changes."
          PATHS=()
          for path in data/used_questions.json data/youtube_publish_history.json; do
            if [ -e "$path" ]; then
              PATHS+=("$path")
            fi
          done
          if [ "${#PATHS[@]}" -eq 0 ]; then
            echo "No history files found to persist." >&2
            exit 1
          fi
          git add -- "${PATHS[@]}"
          for path in $(git diff --cached --name-only); do
            case "$path" in
              data/used_questions.json|data/youtube_publish_history.json) ;;
              *) echo "Refusing to commit unexpected staged file: $path" >&2; exit 1 ;;
            esac
          done

          if git diff --cached --quiet; then
            echo "History files are already committed; nothing to push."
            exit 0
          fi

          git commit -m "Record YouTube 10-question publication for Part $(printf '%03d' "$PART") [skip ci]"
          git fetch origin
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "Rebase conflict: histories were not pushed. Manual reconciliation is required." >&2
            exit 1
          fi
          if ! git push origin HEAD:main; then
            echo "Push failed: histories were not published. Do not force push." >&2
            exit 1
          fi

      - name: Upload generated outputs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-general-knowledge-quiz-scheduled-${{ github.run_id }}
          path: |
            output/**
            data/youtube_publish_history.json
          retention-days: 30
          if-no-files-found: warn

      - name: Upload question history for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-history-${{ github.run_id }}
          path: data/used_questions.json
          retention-days: 30
          if-no-files-found: warn
