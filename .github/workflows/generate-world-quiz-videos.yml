name: Generate World General Knowledge Quiz Videos

on:
  workflow_dispatch:
    inputs:
      start_part:
        description: "First Part number to generate. Use 0 to use the next stored Part number."
        type: string
        default: "0"
      total_parts:
        description: "Number of sequential Parts to generate in this run."
        type: string
        default: "1"
      questions_per_part:
        description: "Questions per Part."
        type: string
        default: "15"
      category:
        description: "Category filter or all."
        type: string
        default: "all"
      difficulty:
        description: "Difficulty filter: all, easy, medium, or hard."
        type: string
        default: "all"
      enable_tts:
        description: "Generate Kokoro TTS narration."
        type: boolean
        default: true
      enable_render:
        description: "Render HyperFrames MP4 videos."
        type: boolean
        default: true

permissions:
  contents: read

env:
  KOKORO_BASE_URL: "http://127.0.0.1:8880"
  KOKORO_MODEL: "kokoro"
  KOKORO_VOICE: "af_heart"
  KOKORO_RESPONSE_FORMAT: "mp3"

jobs:
  generate:
    name: Generate Videos
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: world-quiz-generation
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore question history
        uses: actions/cache@v4
        with:
          path: data/used_questions.json
          key: world-quiz-question-history-${{ github.ref }}
          restore-keys: world-quiz-question-history-
          save-always: true

      - name: Restore HyperFrames browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: world-quiz-hyperframes-browser-${{ runner.os }}
          restore-keys: world-quiz-hyperframes-browser-

      - name: Install HyperFrames
        run: |
          npm install --global hyperframes@0.9.20
          npx hyperframes --version
          npx hyperframes browser ensure

      - name: Set up Kokoro TTS server
        if: ${{ inputs.enable_tts }}
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          if [ ! -d kokoro-server ]; then
            git clone --depth 1 --branch v0.9.2 https://github.com/remsky/Kokoro-FastAPI.git kokoro-server
          fi
          cd kokoro-server
          export PROJECT_ROOT="$PWD"
          export USE_GPU=false
          export PYTHONPATH="$PROJECT_ROOT:$PROJECT_ROOT/api"
          export MODEL_DIR=src/models
          export VOICES_DIR=src/voices/v1_0
          export WEB_PLAYER_PATH="$PROJECT_ROOT/web"
          export ESPEAK_DATA_PATH=/usr/lib/x86_64-linux-gnu/espeak-ng-data
          export HOST=127.0.0.1
          export PORT=8880
          export API_LOG_LEVEL=WARNING
          export PYTHONUTF8=1
          uv venv --python 3.12
          uv pip install --python "$PWD/.venv/bin/python" -e ".[cpu]"
          ./.venv/bin/python -m uvicorn --version
          uv run --python "$PWD/.venv/bin/python" --no-sync python docker/scripts/download_model.py --output api/src/models/v1_0
          nohup "./.venv/bin/python" -m uvicorn api.src.main:app --host "${HOST}" --port "${PORT}" --workers 1 > /tmp/kokoro.log 2>&1 &
          for attempt in $(seq 1 300); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then
              curl -fsS "http://127.0.0.1:${PORT}/v1/models" >/dev/null 2>&1
              echo "Kokoro TTS is ready."
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null
          curl -fsS "http://127.0.0.1:${PORT}/v1/models" >/dev/null

      - name: Upload Kokoro startup logs on failure
        if: failure() && inputs.enable_tts
        uses: actions/upload-artifact@v4
        with:
          name: kokoro-startup-logs-${{ github.run_id }}
          path: /tmp/kokoro.log
          retention-days: 7
          if-no-files-found: warn

      - name: Install npm packages only when Kokoro setup is skipped
        if: ${{ !inputs.enable_tts }}
        run: echo "Kokoro TTS is disabled; no TTS server will be started."

      - name: Generate quiz videos
        run: |
          TTS_ARG=""
          RENDER_ARG=""
          if [ "${{ inputs.enable_tts }}" = "true" ]; then
            TTS_ARG="--tts"
          fi
          if [ "${{ inputs.enable_render }}" = "true" ]; then
            RENDER_ARG="--render"
          fi
          python main.py \
            --start-part "${{ inputs.start_part }}" \
            --total-parts "${{ inputs.total_parts }}" \
            --count "${{ inputs.questions_per_part }}" \
            --category "${{ inputs.category }}" \
            --difficulty "${{ inputs.difficulty }}" \
            $TTS_ARG \
            $RENDER_ARG

      - name: Validate generated MP4 files
        if: always() && inputs.enable_render == true
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import subprocess
          import sys

          videos = sorted(Path("output").rglob("*.mp4"))
          if not videos:
              print("Warning: no MP4 files were produced.")
              raise SystemExit(0)

          for video in videos:
              output = subprocess.check_output(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-select_streams",
                      "v:0",
                      "-show_entries",
                      "stream=width,height,r_frame_rate",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "json",
                      str(video),
                  ],
                  text=True,
              )
              data = json.loads(output)
              stream = data["streams"][0]
              width = stream["width"]
              height = stream["height"]
              fps = stream["r_frame_rate"]
              duration = float(data["format"]["duration"])

              if (width, height) != (1080, 1920):
                  raise SystemExit(f"{video}: invalid resolution {width}x{height}")
              if fps != "30/1":
                  raise SystemExit(f"{video}: invalid frame rate {fps}")
              if duration <= 0:
                  raise SystemExit(f"{video}: invalid duration {duration}")

              print(f"VALIDATED {video}: {width}x{height}, {fps}, {duration:.3f}s")
          PY

      - name: Upload generated outputs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-general-knowledge-quiz-${{ github.run_id }}
          path: output/**
          retention-days: 30
          if-no-files-found: warn
