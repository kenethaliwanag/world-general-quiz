name: Validate World General Knowledge Quiz

on:
  pull_request:
    paths:
      - "core/**"
      - "integrations/**"
      - "config.py"
      - "main.py"
      - "data/questions.json"
      - "data/used_questions.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install HyperFrames
        run: |
          npm install --global hyperframes@0.9.20
          npx hyperframes --version
          npx hyperframes browser ensure

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Validate question generation and duplicate prevention
        run: python main.py --count 2 --category all --difficulty all --reset-history

      - name: Validate HyperFrames composition contract
        run: npx hyperframes check output/hyperframes/part_001
