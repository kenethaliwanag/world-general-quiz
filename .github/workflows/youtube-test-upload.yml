name: YouTube 10-Question Video Test Upload (Private)

# Manual, controlled integration test only. No schedule, no push/PR trigger.
# This workflow never publishes publicly and never touches Facebook publishing.
on:
  workflow_dispatch:
    inputs:
      part_number:
        description: "Part to upload. Use 0 to select the next stored Part number."
        type: string
        default: "0"

concurrency:
  group: youtube-shorts-publish
  cancel-in-progress: false

permissions:
  contents: write # to persist the question and YouTube publication histories

env:
  KOKORO_BASE_URL: "http://127.0.0.1:8880"
  KOKORO_MODEL: "kokoro"
  KOKORO_VOICE: "af_bella"
  KOKORO_RESPONSE_FORMAT: "mp3"

jobs:
  upload-one-private-video:
    name: Generate one 10-question video and upload it privately to YouTube
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Restore HyperFrames browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: world-quiz-hyperframes-browser-${{ runner.os }}
          restore-keys: world-quiz-hyperframes-browser-

      - name: Install HyperFrames
        run: |
          npm install --global hyperframes@0.9.20
          npx hyperframes --version
          npx hyperframes browser ensure

      # Presence only: the command prints secret names with PRESENT/MISSING, never values.
      - name: Verify required YouTube secrets are configured
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        run: |
          set -euo pipefail
          python main.py --youtube-check-secrets

      - name: Resolve Part number
        id: part
        run: |
          set -euo pipefail
          PART="${{ inputs.part_number }}"
          PART="${PART:-0}"
          if [ "$PART" = "0" ]; then
            PART="$(python -c 'from core.youtube_output import TEN_QUESTION_CONTENT_TYPE, next_youtube_part_number; print(next_youtube_part_number(content_type=TEN_QUESTION_CONTENT_TYPE))')"
          fi
          if ! [[ "$PART" =~ ^[0-9]+$ ]] || [ "$PART" -lt 1 ]; then
            echo "Part number must be a positive integer (or 0 for the next stored Part)." >&2
            exit 1
          fi
          echo "part_number=$PART" >> "$GITHUB_OUTPUT"

      # The resolver is the single source of truth for the 10-question video path.
      # An existing video is reused on retry instead of being overwritten.
      - name: Resolve YouTube output paths
        id: paths
        env:
          PART_NUMBER: ${{ steps.part.outputs.part_number }}
        run: |
          set -euo pipefail
          PART="${PART_NUMBER:-0}"
          python - "$PART" > /tmp/youtube_paths.txt <<'PY'
          import sys
          from pathlib import Path
          from core.youtube_output import youtube_part_dir, youtube_ten_question_video_path

          part = int(sys.argv[1])
          root = Path("output/youtube")
          video = youtube_ten_question_video_path(part, root)
          print(f"part_dir={youtube_part_dir(part, root)}")
          print(f"video_path={video}")
          print(f"needs_generation={0 if video.is_file() else 1}")
          PY
          cat /tmp/youtube_paths.txt >> "$GITHUB_OUTPUT"
          if grep -q '^needs_generation=0$' /tmp/youtube_paths.txt; then
            echo "Reusing existing YouTube 10-question video for this Part; no regeneration."
          fi

      - name: Set up Kokoro TTS server
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng
          if [ ! -d kokoro-server ]; then
            git clone --depth 1 --branch v0.9.2 https://github.com/remsky/Kokoro-FastAPI.git kokoro-server
          fi
          cd kokoro-server
          export PROJECT_ROOT="$PWD"
          export USE_GPU=false
          export PYTHONPATH="$PROJECT_ROOT:$PROJECT_ROOT/api"
          export MODEL_DIR=src/models
          export VOICES_DIR=src/voices/v1_0
          export WEB_PLAYER_PATH="$PROJECT_ROOT/web"
          export ESPEAK_DATA_PATH=/usr/lib/x86_64-linux-gnu/espeak-ng-data
          export HOST=127.0.0.1
          export PORT=8880
          export API_LOG_LEVEL=WARNING
          export PYTHONUTF8=1
          uv venv --python 3.12
          uv pip install --python "$PWD/.venv/bin/python" -e ".[cpu]"
          ./.venv/bin/python -m uvicorn --version
          uv run --python "$PWD/.venv/bin/python" --no-sync python docker/scripts/download_model.py --output api/src/models/v1_0
          nohup "./.venv/bin/python" -m uvicorn api.src.main:app --host "${HOST}" --port "${PORT}" --workers 1 > /tmp/kokoro.log 2>&1 &
          for attempt in $(seq 1 300); do
            if curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null 2>&1; then
              curl -fsS "http://127.0.0.1:${PORT}/v1/models" >/dev/null 2>&1
              echo "Kokoro TTS is ready."
              break
            fi
            sleep 2
          done
          curl -fsS "http://127.0.0.1:${PORT}/health" >/dev/null
          curl -fsS "http://127.0.0.1:${PORT}/v1/models" >/dev/null

      - name: Upload Kokoro startup logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-kokoro-startup-logs-${{ github.run_id }}
          path: /tmp/kokoro.log
          retention-days: 7
          if-no-files-found: warn

      # Existing Facebook 10-question tracker pipeline, routed to the YouTube root.
      - name: Generate exactly one 10-question video
        env:
          QUESTIONS_PER_PART: "10"
        run: |
          set -euo pipefail
          PART_NUMBER="${{ steps.part.outputs.part_number }}"
          if [ "${{ steps.paths.outputs.needs_generation }}" = "1" ]; then
            python main.py \
              --part "$PART_NUMBER" \
              --count "$QUESTIONS_PER_PART" \
              --category all \
              --difficulty all \
              --tts \
              --render-ten-video \
              --ten-question-count 10 \
              --youtube-ten-question-video \
              --output-root output/youtube
          else
            echo "10-question video already exists for Part ${PART_NUMBER}; skipping generation to avoid overwriting it."
          fi
          # Question history is persisted by the final always-run step, even if a later
          # validation or upload step fails. Do not commit or push it here.

      # Measure the real generated MP4. Values are printed; no mocked probe data is used.
      # The Shorts-only 180s limit is intentionally NOT applied to this format.
      - name: Validate the generated 10-question video with ffprobe
        env:
          PART_NUMBER: ${{ steps.part.outputs.part_number }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          from core.youtube_output import youtube_ten_question_video_path

          part = int(os.environ["PART_NUMBER"])
          video = youtube_ten_question_video_path(part, Path("output/youtube"))
          if not video.is_file():
              raise SystemExit(f"Generated 10-question video not found: {video}")
          size = video.stat().st_size
          if size <= 0:
              raise SystemExit(f"Generated 10-question video is empty: {video}")
          script = video.parent / "script.json"
          if not script.is_file():
              raise SystemExit(f"Associated script JSON not found: {script}")
          quiz = json.loads(script.read_text(encoding="utf-8"))
          questions = quiz.get("questions", [])
          if len(questions) != 10:
              raise SystemExit(f"Expected exactly 10 questions in {script}, found {len(questions)}")
          data = json.loads(subprocess.check_output([
              "ffprobe", "-v", "error",
              "-show_entries", "stream=codec_type,codec_name,width,height,r_frame_rate",
              "-show_entries", "format=duration",
              "-of", "json", str(video),
          ], text=True))
          streams = data.get("streams", [])
          v = next((s for s in streams if s.get("codec_type") == "video"), None)
          a = next((s for s in streams if s.get("codec_type") == "audio"), None)
          duration = float(data.get("format", {}).get("duration", 0) or 0)
          print(f"Video: {video}")
          print(f"File size: {size} bytes")
          print(f"Questions in script: {len(questions)}")
          if not v:
              raise SystemExit("No video stream in generated video")
          if not a:
              raise SystemExit("No audio stream in generated video")
          print(f"Video: {v.get('width')}x{v.get('height')} {v.get('codec_name')} {v.get('r_frame_rate')}")
          print(f"Audio: {a.get('codec_name')}")
          print(f"Measured duration: {duration:.3f}s")
          if (v.get("width"), v.get("height")) != (1080, 1920):
              raise SystemExit("Invalid resolution; expected 1080x1920")
          if v.get("codec_name") != "h264":
              raise SystemExit("Invalid video codec; expected h264")
          if v.get("r_frame_rate") != "30/1":
              raise SystemExit("Invalid frame rate; expected 30/1")
          if a.get("codec_name") != "aac":
              raise SystemExit("Invalid audio codec; expected aac")
          if duration <= 0:
              raise SystemExit("Invalid duration; expected a positive value")
          print("Note: YouTube may classify vertical videos up to 3 minutes as Shorts; no padding is applied.")
          print("YouTube 10-question video preflight: PASS")
          PY

      - name: YouTube 10-question video dry-run preflight (no HTTP)
        env:
          PART_NUMBER: ${{ steps.part.outputs.part_number }}
        run: |
          set -euo pipefail
          python main.py --publish-youtube-video --part "$PART_NUMBER" --output-root output/youtube

      # The only step allowed to unlock network uploads. Privacy is forced to private in main.py.
      - name: Controlled private YouTube 10-question video upload
        id: upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_ALLOW_NETWORK_UPLOAD: "true"
          YOUTUBE_PUBLISH_ENABLED: "true"
          YOUTUBE_PUBLISH_DRY_RUN: "false"
          YOUTUBE_PRIVACY_STATUS: "private"
          PART_NUMBER: ${{ steps.part.outputs.part_number }}
        run: |
          set -euo pipefail
          python main.py --youtube-video-upload --part "$PART_NUMBER" --output-root output/youtube

      # One always-run step persists both histories, so a generated Part's used questions
      # survive a failed ffprobe/OAuth/upload step. Only these two exact paths are staged.
      - name: Persist question and YouTube publication history
        if: always()
        env:
          PART_NUMBER: ${{ steps.part.outputs.part_number }}
        run: |
          set -euo pipefail
          PART="${PART_NUMBER:-0}"
          CHANGED="$(git status --porcelain -- data/used_questions.json data/youtube_publish_history.json)"
          if [ -z "$CHANGED" ]; then
            echo "No question or YouTube history changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          PATHS=()
          for path in data/used_questions.json data/youtube_publish_history.json; do
            if [ -e "$path" ]; then
              PATHS+=("$path")
            fi
          done
          git add -- "${PATHS[@]}"
          # Fail visibly rather than commit an unrelated file that was already staged.
          for path in $(git diff --cached --name-only); do
            case "$path" in
              data/used_questions.json|data/youtube_publish_history.json) ;;
              *) echo "Refusing to commit unexpected staged file: $path" >&2; exit 1 ;;
            esac
          done
          git commit -m "Record quiz question and YouTube publication history for Part $(printf '%03d' "$PART") [skip ci]"
          git fetch origin
          if ! git rebase origin/main; then
            echo "Rebase conflict: history was not pushed. Reconcile from the run artifacts." >&2
            exit 1
          fi
          if ! git push origin HEAD:main; then
            echo "Push failed: history was not published. Do not force push." >&2
            exit 1
          fi

      - name: Upload generated outputs and YouTube history as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-shorts-test-upload-${{ github.run_id }}
          path: |
            output/youtube/**
            data/used_questions.json
            data/youtube_publish_history.json
          retention-days: 30
          if-no-files-found: warn

      - name: Generate step summary on failure
        if: failure()
        run: |
          echo "YouTube 10-question video private test upload failed. Review the job logs and artifacts." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not retry this Part automatically if the upload result was uncertain." >> "$GITHUB_STEP_SUMMARY"
